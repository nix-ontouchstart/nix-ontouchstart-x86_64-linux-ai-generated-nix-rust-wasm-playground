name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change this to your default branch name
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-26.04
    
    steps:
      - uses: actions/checkout@v7

      - name: Platform
        run: uname -a
      - name: install nix from https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.3/nix-installer.sh
        run: cat nix-installer.sh | sh -s -- install --no-confirm
      - name: nix version
        run: nix --version
      - name: nix flake show
        run: nix flake show

      - name: Build Project
        # This runs 'make frontend.js', which triggers 'nix build' 
        # and copies the results into the current directory (.)
        run: make frontend.js

      - name: Upload Build Artifacts
        # This prepares the files (index.html, frontend.js, frontend_bg.wasm)
        # for deployment. The Makefile copies them to the root (.).
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

